<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Login | JBS Ethics Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="{{ url_for('favicon') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/loading.css') }}">

<style>
  /* Full-page background that shows the entire image */
html, body {
  height: 100%;
  margin: 0;
}

body {
  min-height: 100vh;
  background-image: url("{{ url_for('static', filename='img/b5.jpg') }}");
  background-repeat: no-repeat;
  /* background-position: top center; */
  background-size: cover;          /* shows the whole picture */
  background-color: #ffffff;         /* fills side/bottom gaps when aspect ratios differ */
  /* If you want it to stay still while scrolling: */
  background-attachment: fixed;
}

/* @media (min-width: 992px) {
  body { background-position: center -300px; } 

} */

</style>

<body>

  <!-- Header -->
<!-- <header class="navbar custom-navbar"> -->
  <!-- Left-side logo + system name -->
  <!-- <div class="d-flex align-items-center gap-3">
    <img src="{{ url_for('static', filename='img/image.png') }}" alt="UJ Logo" height="40" style="background-color: white; padding: 3px; border-radius: 4px;">
    <span class="fs-5 fw-bold">JBS Ethics System</span>
  </div>
</header> -->

  <!-- Right-aligned logo (kept visible) -->
  <div class="logo" style="padding: 1.5px; border-radius: 2px; height: 20px;">
    <!-- <img src="{{ url_for('static', filename='img/image.png') }}" alt="UJ Logo" height="60" style="background-color: white; padding: 3px; border-radius: 4px;"> -->
  </div>
  <br>
  <br>
  <br>
  <br>
  <br>
  <br>
  <br>


  <!-- Login Form -->
  <main class="auth-wrapper">
  <div class="container-lg">
    <div class="auth-card">
      
      <!-- LEFT: login form -->
      <section class="auth-form">
        <img class="auth-logo" src="{{ url_for('static', filename='img/image.png') }}" alt="UJ Logo"> 
           <h2 class="centered-text mb-3">Login</h2>

        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-secondary alert-dismissible fade show js-timed-flash" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}

        <form action="{{ url_for('login_page') }}" method="post" id="loginForm">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="email" name="email" placeholder="UJ Email" required>
          <input type="password" name="password" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>

        <p class="switch-link mt-3">Don’t have an account?
          <a href="{{ url_for('register') }}">Register here</a>
        </p>
      </section>

      <!-- RIGHT: image + CTA -->
      <aside class="auth-side"
        style="--auth-image: url('{{ url_for('static', filename='img/jbs.jpg') }}');">
        <div class="auth-side-overlay">
          <h3 class="mb-2">New here?</h3>
          <p class="mb-4">Create an account to submit and track your ethics applications.</p>
          <a class="btn btn-light fw-bold" href="{{ url_for('register') }}">Register</a>
        </div>
      </aside>

    </div>
  </div>
</main>


  <!-- Footer -->
 <!-- <footer class="footer">
   
</footer> -->

<script>
    document.querySelectorAll('.js-timed-flash').forEach(function(alertMessage) {
      window.setTimeout(function() {
        if (window.bootstrap && window.bootstrap.Alert) {
          window.bootstrap.Alert.getOrCreateInstance(alertMessage).close();
        } else {
          alertMessage.classList.remove('show');
          window.setTimeout(function() {
            alertMessage.remove();
          }, 200);
        }
      }, 4000);
    });
  </script>
<script>
  window.addEventListener('pageshow', function (event) {
    const navEntry = performance.getEntriesByType('navigation')[0];
    const isHistoryNavigation = event.persisted || (navEntry && navEntry.type === 'back_forward');

    if (isHistoryNavigation) {
      window.location.replace('{{ url_for("logout") }}');
    }
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/form-submission-handler.js') }}"></script>
</body>

</html>
