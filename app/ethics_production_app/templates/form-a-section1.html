<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8" />
  <title>Form A – Section 1 | JBS Ethics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/form_a.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/form_a.css') }}">
  <style>
    .form-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-bar {
      width: 100%;
      background-color: #ddd;
      border-radius: 20px;
      overflow: hidden;
      margin: 1rem 0;
    }

    .progress-fill {
      height: 20px;
      background-color: var(--jbs-teal);
      width: 14.28%;
      /* 1 out of 7 steps */
      color: white;
      text-align: center;
      font-size: 0.85rem;
      line-height: 20px;
    }

    .form-section label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }

    .form-navigation {
      margin-top: 2rem;
      display: flex;
      justify-content: space-between;
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/loading.css') }}">
</head>

<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-content">
      <img src="{{ url_for('static',filename='img/image.png')}}" alt="UJ JBS Logo" class="logo uj">
      <span class="nav-title">Form A – Section 1: Researcher’s Details</span>

      <!-- Logout -->
      <div style="text-align: right;">

        <a href="{{ url_for('logout')}}" class="btn-logout">Logout</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Autosave Status Indicator -->
    <div id="autosave-status" style="position: fixed; top: 70px; right: 20px; padding: 8px 16px; background: #f0f0f0; border-radius: 4px; font-size: 14px; z-index: 1000;"></div>

    <!-- Top Bar -->
    <!-- <div class="form-header">
      <button class="approve-btn" onclick="saveDraft()">Save Draft</button>
      <strong>Step 1 of 7</strong>
    </div> -->

    <!-- Progress Bar -->
    <div class="progress-bar">
      <div class="progress-fill" style="width: 14%">14%</div>
    </div>

    <!-- Form -->
    <form action="{{url_for('form_a_sec1')}}" method="post">
      
   
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="forma_id" value="{{ form_data.form_id if form_data and form_data.form_id else '' }}">
      <div class="form-section">
         <h2>Section 1: Researcher’s Details</h2>
        <label for="applicant-name">Applicant Name</label>
        <input type="text" id="applicant-name" name="applicant_name" value="{{ form_data.applicant_name if form_data and form_data.applicant_name else '' }}" required>

        <label for="student-number">Student / Staff Number</label>
        <input type="text" id="student-number" name="student_number" value="{{ form_data.student_number if form_data and form_data.student_number else '' }}" required>

        <label for="institution">Institution</label>
        <input type="text" id="institution" name="institution" value="{{ form_data.institution if form_data and form_data.institution else 'University of Johannesburg' }}" required>

        <label for="department">UJ Department and School</label>
        <input type="text" id="department" name="department" value="{{ form_data.department if form_data and form_data.department else '' }}" required>

        <label for="degree">Degree Registered For</label>
        <input type="text" id="degree" name="degree" value="{{ form_data.degree if form_data and form_data.degree else '' }}" required>

        <label for="title">Title / Working Title of Study</label>
        <input type="text" id="title" name="study_title" value="{{ form_data.study_title if form_data and form_data.study_title else '' }}" required>

        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" value="{{ form_data.mobile if form_data and form_data.mobile else '' }}" required maxlength="10" pattern="\d{10}">

      </div>

      <!-- Navigation Buttons -->
      <div class="form-navigation">
        <a href="{{url_for('form_a_upload')}}" class="revise-btn">⬅ Back</a>
        <button type="submit" class="approve-btn">Next ➔ Section 2</button>
      </div>
    </form>

  </main>

  <!-- Footer -->
<footer class="footer">
   
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/form-submission-handler.js') }}"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const AUTOSAVE_DEBUG = true;
  function debugLog() {
    if (!AUTOSAVE_DEBUG) return;
    console.log('[FORM-A-SEC1]', ...arguments);
  }

  debugLog('Autosave script initialized');

  const form = document.querySelector('form');
  if (!form) {
    console.error('[FORM-A-SEC1] No form found on page');
    return;
  }

  let autosaveTimeout = null;
  const savingIndicator = document.getElementById('autosave-status');

  function showSaving() {
    if (savingIndicator) savingIndicator.innerHTML = '<span style="color:blue">Autosaving...</span>';
  }

  function showSaved() {
    if (savingIndicator) {
      savingIndicator.innerHTML = '<span style="color:green">✓ Saved</span>';
      setTimeout(() => { savingIndicator.innerHTML = ''; }, 1500);
    }
  }

  function showError() {
    if (savingIndicator) savingIndicator.innerHTML = '<span style="color:red">Error saving</span>';
  }

  function autosave() {
    showSaving();
    const formData = new FormData(form);
    debugLog('Autosave start');
    
    // Remove CSRF token from autosave (not needed for this endpoint)
    formData.delete('csrf_token');

    // Handle checkboxes explicitly with stable [] group behavior
    const checkboxes = form.querySelectorAll('input[type="checkbox"]');
    const arrayCheckboxNames = new Set();
    checkboxes.forEach(cb => {
      if (cb.name && cb.name.endsWith('[]')) arrayCheckboxNames.add(cb.name);
    });
    arrayCheckboxNames.forEach(name => formData.delete(name));

    checkboxes.forEach(cb => {
      if (cb.name.endsWith('[]')) {
        if (cb.checked) formData.append(cb.name, cb.value || 'Yes');
      } else {
        formData.set(cb.name, cb.checked ? 'Yes' : 'No');
      }
    });
    
    // Preserve radio button values
    const radioButtons = form.querySelectorAll('input[type="radio"]');
    radioButtons.forEach(rb => {
      if (rb.checked) {
        formData.set(rb.name, rb.value);
      }
    });

    debugLog('Sending autosave request', '/form_a_sec1_autosave');
    fetch("{{ url_for('form_a_sec1_autosave') }}", {
      method: 'POST',
      body: formData,
    })
    .then(r => {
      debugLog('Autosave response status', r.status, r.statusText);
      return r.json().catch(err => {
        console.error('[FORM-A-SEC1] Error parsing JSON:', err);
        return { success: false, error: 'Invalid JSON' };
      });
    })
    .then(data => {
      debugLog('Autosave response data', data);
      if (data.success) {
        showSaved();
      } else {
        showError();
        console.error('[FORM-A-SEC1] Autosave error:', data.error);
      }
    })
    .catch(err => {
      showError();
      console.error('[FORM-A-SEC1] Fetch error:', err);
    });
  }

  // Attach autosave to all input fields
  function attachAutosaveListeners() {
    const allFields = Array.from(form.querySelectorAll('input:not([type="file"]), textarea, select'));
    allFields.forEach(field => {
      // Skip CSRF token field
      if (field.name === 'csrf_token') return;
      if (field.dataset.autosaveBound === '1') return;
      
      const eventType = (field.type === 'checkbox' || field.type === 'radio' || field.tagName === 'SELECT') ? 'change' : 'input';
      field.addEventListener(eventType, function() {
        const valuePreview = field.type === 'checkbox' ? field.checked : field.value;
        debugLog('Field event', {
          name: field.name,
          type: field.type,
          eventType: eventType,
          value: valuePreview
        });
        clearTimeout(autosaveTimeout);
        autosaveTimeout = setTimeout(function() {
          debugLog('Debounced autosave trigger for field', field.name);
          autosave();
        }, 700);
      });
      field.dataset.autosaveBound = '1';
    });
  }

  attachAutosaveListeners();
});
</script>
</body>

</html>
