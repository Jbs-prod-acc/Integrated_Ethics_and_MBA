<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/ethics-shell.css">
    <link rel="stylesheet" href="/static/css/app.css">
  </head>
  <body class="login-page">
    <main class="auth-panel login-bg" id="main-content">
      <div class="auth-card">
        <img src="/static/img/image.png" alt="UJ JBS Logo" class="auth-logo">
        <h1 class="login-heading">Welcome to MBA &amp; Ethics Portal</h1>
        <p class="login-subheading">Sign in to access your dashboard</p>

        {% if messages %}
          <div class="flash-stack">
            {% for message in messages %}
              <div class="flash flash--error">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}

        <form action="/login" method="post" class="form-stack" autocomplete="on">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="system" value="ethics">
          <label>
            <span>Email</span>
            <input type="email" name="email" required autocomplete="email" placeholder="you@email.com">
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" required autocomplete="current-password" placeholder="Password">
          </label>
          <button type="submit" class="primary-button login-btn">Sign in</button>
        </form>

        <div class="auth-links">
          <a href="/login?system=ethics">Shared login</a>
        </div>
      </div>
    </main>
  </body>
</html>
